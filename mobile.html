<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STARSHIP TRILOGY // MOBILE BRIDGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Chakra+Petch:wght@700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-app-mode="mobile" data-theme="enterprise">
  <video id="webcam-video" playsinline autoplay muted style="display:none;"></video>
  <input type="file" id="audio-file-input" accept="audio/*" style="display:none;">
  <canvas id="bridge-canvas"></canvas>
  <div id="lut-overlay" aria-hidden="true"></div>

  <div id="ui-layer">
    <!-- Mobile Top Bar + 3 Real-Time Theme Switcher -->
    <div class="mobile-top hud-reveal hidden">
      <div class="mobile-header-row">
        <div class="brand-box">
          <div class="brand-title" id="brand-title">U.S.S. ENTERPRISE</div>
        </div>
        <div style="display:flex; gap:5px;">
          <button class="btn" id="btn-sim-mode">CAM/PAD</button>
          <button class="btn danger" id="btn-alert">⚠</button>
          <a class="btn" href="./index.html" title="Desktop">💻</a>
        </div>
      </div>
      <div class="theme-switcher">
        <button class="theme-btn" data-theme="void">VOID</button>
        <button class="theme-btn active" data-theme="enterprise">ENTERPRISE</button>
        <button class="theme-btn" data-theme="cyber">CYBER</button>
      </div>
    </div>

    <!-- Bottom Touch XY Controller + Audio Controls -->
    <div class="touch-pad-wrap hud-reveal hidden">
      <div class="xy-pad" id="xy-pad">
        <span class="xy-label top">▲ WARP FLANGER</span>
        <span class="xy-label bot">▼ SUB FILTER</span>
        <span class="xy-label left">◀ VOCODER</span>
        <span class="xy-label right">PITCH ▶</span>
        <div id="xy-puck"></div>
      </div>

      <div class="mobile-hold-row">
        <button class="hold-btn" id="hold-echo">HOLD · SPACE ECHO</button>
        <button class="hold-btn gold" id="hold-shimmer">HOLD · SHIMMER</button>
      </div>

      <div class="vu-bg"><div id="vu-fill"></div></div>

      <div class="mobile-audio-bar">
        <button class="btn primary" id="btn-synth-toggle">■ SYNTH</button>
        <button class="btn" id="btn-file-pick">📁 MP3</button>
        <button class="btn" id="btn-mic-toggle">🎙️ MIC</button>
        <button class="btn" id="btn-bypass">FX: ON</button>
      </div>
    </div>

    <!-- Mobile Boot -->
    <div id="boot-screen">
      <h1>MOBILE BRIDGE</h1>
      <p class="boot-sub">Versione smartphone ottimizzata: usa la <b>fotocamera frontale</b> oppure il <b>Touch Pad XY</b> e cambia tema in tempo reale.</p>
      <p class="hint" id="boot-status" style="margin-bottom:14px;"></p>
      <div class="boot-actions">
        <button class="btn primary large" id="btn-boot-sim">👆 AVVIA TOUCH PAD (ISTANTANEO)</button>
        <button class="btn large" id="btn-boot-cam">📷 AVVIA CON FACE-MAP CAMERA</button>
      </div>
      <div class="boot-links">
        <a href="./mobile-pocket.html">⚡ Pocket Lite</a>
        <span>·</span>
        <a href="./index.html">💻 Versione Desktop</a>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
